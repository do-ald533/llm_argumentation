[project]
name = "llm-argumentation-structuring"
version = "0.1.0"
description = "LLM-based argumentation structuring and analysis pipeline"
readme = "README_NEW.md"
requires-python = ">=3.10"
dependencies = [
    # Core
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    
    # LLM and AI
    "openai>=1.10.0",
    "langgraph>=0.0.20",
    
    # Data processing
    "polars>=0.20.0",
    
    # Graph algorithms
    "networkx>=3.0",
    
    # Logging
    "structlog>=24.1.0",
    
    # Experiment tracking
    "mlflow>=2.10.0",
]

[project.optional-dependencies]
# Visualization
viz = [
    "matplotlib>=3.5.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
